<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>Juicebox</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Font Awesome CSS-->
    <link rel="stylesheet" href="//maxcdn.bootstrapcdn.com/font-awesome/4.2.0/css/font-awesome.min.css">

    <!-- Juicebox CSS-->
    <link rel="stylesheet" type="text/css" href="../css/juicebox.css">


</head>

<body>


<div id="app-container"></div>


<script type="module">

    import hic from "../js/index.js";
    import { devMapUrl } from '../dev-proxy/map-url.js'

    // Dev-only: routes .hic reads on hosts that answer localhost with a bot challenge
    // (encodeproject.org today) through the dev server's proxy. In a host app this is
    // guarded by import.meta.env.DEV; these pages only run under the dev server. See the
    // README, "Loading maps from hosts that serve a bot challenge".
    hic.setUrlMapper(devMapUrl)

    const container = document.getElementById("app-container");


    // Crosshairs echo, #708: hold Shift over a panel. The first two are a sync
    // group and echo each other; the third has opted out and shows no echo.
    const map = (name, extra = {}) => ({
        "backgroundColor": "255,255,255",
        "url": "https://hicfiles.s3.amazonaws.com/external/dekker/4dn/h1hesc.hic",
        "name": name,
        "state": "3,3,2,0,0,640,640,1.454380698186564,NONE",
        "colorScale": "602,255,0,0",
        "nvi": "23671753603,36479",
        ...extra
    })

    const config = {
        "browsers": [
            map("synced A"),
            map("synced B"),
            map("isolated", {"synchable": false})
        ]
    }

    hic.init(container, config)
        .then(function (hicBrowser) {

        })


</script>

</body>

</html>
