<html>
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>Juicebox</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Font Awesome CSS-->

    <!-- Juicebox CSS-->

   <link rel="stylesheet" href="../css/juicebox.css">

    <!-- Juicebox js -- defines global "juicebox" -->
    <!-- <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/juicebox.js@2.4.8/dist/juicebox.min.js"></script> -->


</head>

<body>
<h1>Dynamic load example</h1>

This example illustrates the use of the juicebox API to dynamically load a map and tracks from menu actions.

<div style="margin-top: 50px;">
    <h2>Step 1: Select a hic file to load</h2>
    <label for="hic-select"><span style="font-size: large;font-weight: bold">Contact Matrix (.hic file)</span></label>
    <select id="hic-select">
        <option value="">None</option>
        <option value="https://www.encodeproject.org/files/ENCFF718AWL/@@download/ENCFF718AWL.hic">GM12878</option>
        <option value="https://www.encodeproject.org/files/ENCFF406HHC/@@download/ENCFF406HHC.hic">K562</option>
    </select>
</div>

<div style="margin-top: 50px;margin-bottom: 50px">
    <h2>Step 2: Select a track</h2>
    <label for="tracks-select"><span style="font-size: large;font-weight: bold">Tracks</span></label>
    <select id="tracks-select" disabled>
        <option value="">None</option>
        <option value="GM12878">GM12878 CTCF</option>
        <option value="K562">K562 CTCF</option>
    </select>
</div>


<div style="margin-top: 50px;margin-bottom: 50px">
    <h2>Or: load a session file from disk</h2>
    <label for="session-input"><span style="font-size: large;font-weight: bold">Session (.json file)</span></label>
    <input type="file" id="session-input" accept=".json,application/json">
    <span id="session-status" style="margin-left: 10px"></span>
</div>


<div id="app-container"></div>


<script type="module">

    import juicebox from '../js/index.js';
    import { devMapUrl } from '../dev-proxy/map-url.js'

    // Dev-only: routes .hic reads on hosts that answer localhost with a bot challenge
    // (encodeproject.org today) through the dev server's proxy. In a host app this is
    // guarded by import.meta.env.DEV; these pages only run under the dev server. See the
    // README, "Loading maps from hosts that serve a bot challenge".
    juicebox.setUrlMapper(devMapUrl)

    const config = {}

    const container = document.getElementById("app-container");

    juicebox.init(container, config)
        .then(function (hicBrowser) {
            console.log("Juicebox loaded");
            initMenus();
        })


    function initMenus() {
        const hicSelect = document.getElementById("hic-select");
        const tracksSelect = document.getElementById("tracks-select");
        const sessionInput = document.getElementById("session-input");
        const sessionStatus = document.getElementById("session-status");

        hicSelect.onchange = async (e) => {
            const idx = hicSelect.selectedIndex;
            const option = hicSelect.options[idx];
            // getCurrentBrowser() rather than the browser init handed us: a
            // session restore replaces the browsers, so the original is stale.
            await juicebox.getCurrentBrowser().loadHicFile({url: option.value});
            tracksSelect.removeAttribute("disabled")
        }

        tracksSelect.onchange = (e) => {
            const idx = tracksSelect.selectedIndex;
            const option = tracksSelect.options[idx];
            const trackConfig = trackDictionary[option.value];
            juicebox.getCurrentBrowser().loadTracks([trackConfig]);
        }

        // A session file is just JSON on disk: the host reads it and hands the
        // parsed object to restoreSession. juicebox never sees the File.
        sessionInput.onchange = async (e) => {

            const file = sessionInput.files[0];
            if (!file) {
                return;
            }

            sessionStatus.textContent = `Loading ${file.name} ...`;

            try {
                const session = JSON.parse(await file.text());
                await juicebox.restoreSession(container, session);
                sessionStatus.textContent = `Loaded ${file.name}`;
            } catch (error) {
                console.error(error);
                sessionStatus.textContent = `Could not load ${file.name}: ${error.message}`;
            }

            // Restoring replaces the browsers, so the menus above no longer
            // describe what is on screen. Reset them, and allow the same file
            // to be picked again.
            hicSelect.selectedIndex = 0;
            tracksSelect.selectedIndex = 0;
            tracksSelect.setAttribute("disabled", "disabled");
            sessionInput.value = "";
        }

    }


    // Define a couple of track configurations
    const trackDictionary = {

        "GM12878": {
            "name": "GM12878 CTCF ",
            "url": "https://www.encodeproject.org/files/ENCFF000ARJ/@@download/ENCFF000ARJ.bigWig",
            "autoscale": true,
            "displayMode": "COLLAPSED",
            "format": "bigwig",
            "color": "rgb(0,150,0)",
            "height": 40
        },
        "K562": {
            "name": "K562 CTCF ",
            "url": "https://www.encodeproject.org/files/ENCFF000YMA/@@download/ENCFF000YMA.bigWig",
            "autoscale": true,
            "displayMode": "COLLAPSED",
            "format": "bigwig",
            "color": "rgb(0, 150, 0)",
            "height": 40
        }
    }

    const t = []


</script>

</body>

</html>
