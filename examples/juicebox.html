<html>
<head>
    <meta charSet="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title>Juicebox - ES6 </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Font Awesome CSS-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.2.0/css/font-awesome.css">

    <!-- Juicebox CSS-->
    <link rel="stylesheet" href="../css/juicebox.css">

</head>

<body>

<div id="app-container"></div>

<script type="module">

    import juicebox from '../js/index.js';
    import { devMapUrl } from '../dev-proxy/map-url.js'

    // Dev-only: routes .hic reads on hosts that answer localhost with a bot challenge
    // (encodeproject.org today) through the dev server's proxy. In a host app this is
    // guarded by import.meta.env.DEV; these pages only run under the dev server. See the
    // README, "Loading maps from hosts that serve a bot challenge".
    juicebox.setUrlMapper(devMapUrl)

    const config =
        {
            "backgroundColor": "255,255,255",
            "url": "https://www.encodeproject.org/files/ENCFF718AWL/@@download/ENCFF718AWL.hic",
            "name": "GM12878 in situ combined",
            "locus": "18:28,504,357-29,748,974 18:28,504,357-29,748,974",
            "normalization": "VC_SQRT",
            "colorScale": "66.20668236071833,255,0,0",
            "tracks": [
                {
                    "url": "https://www.encodeproject.org/files/ENCFF144KUK/@@download/ENCFF144KUK.bigWig",
                    "type": "wig",
                    "format": "bigwig",
                    "name": "Homo sapiens GM12878 CTCF",
                    "color": "green"
                },
                {
                    "url": "https://hgdownload.soe.ucsc.edu/goldenPath/hg19/database/ncbiRefSeq.txt.gz",
                    "type": "annotation",
                    "format": "refgene",
                    "name": "Refseq Genes",
                },
                {
                    "url": "https://raw.githubusercontent.com/igvteam/igv-data/refs/heads/main/data/test/bedpe/GM12878_loops.bedpe",
                    "name": "Rao & Huntley et al. | Cell 2014 | GM12878 loops",
                    "color": "#fffa03",
                    "displayMode": "upper"
                },
                {
                    "url": "https://raw.githubusercontent.com/igvteam/igv-data/refs/heads/main/data/test/bedpe/GSM1872886_GM12878_CTCF_PET.bedpe.txt",
                    "name": "Tang et al. | Cell 2015 | GM12878 CTCF ChIA-PET",
                    "color": "#000000",
                    "displayMode": "lower"
                }
            ]
        }


    juicebox.init(document.getElementById("app-container"), config)
        .then(browser => {
            console.log(`${browser.id} is good to go`)
        })


</script>

</body>

</html>
